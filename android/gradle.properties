org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Enable Flutter's built-in Kotlin support (removes KGP dependency warnings)
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Disable Kotlin incremental compilation to avoid cross-drive path errors on Windows
# (pub cache on C:\ vs project on D:\ causes IllegalArgumentException in Kotlin daemon)
kotlin.incremental=false
